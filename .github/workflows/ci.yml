name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install (core + test)
        run: pip install -e ".[dev]"
      - name: Install MCP SDK (latest) and MDTraj cross-check (Python >= 3.10 only)
        if: matrix.python != '3.9'
        run: pip install -e ".[server]" mdtraj
      # Real network tests run here (RCSB, AlphaFold). Tests that need a real VMD
      # are SKIPPED on CI (VMD cannot be installed from a public package); -rs
      # prints every skip with its reason. Run them on a machine that has VMD.
      - name: Lint, dead-code check and the whole test suite
        run: pip install ruff vulture && ruff check src tests && vulture && pytest -q -rs
      - name: Cross-validation against independent NumPy
        run: vmd-agent bench validate tests/data/sample/sample.pdb tests/data/sample/sample.dcd --sel2 "resname LIG" --cutoff 6

  mcp1:
    # The server supports both MCP SDK generations; test the older one for real.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" "mcp<2"
      - run: pytest -q -rs tests/surfaces/test_server.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build the open-source image (no VMD)
        run: |
          for i in 1 2 3; do
            docker build -f docker/Dockerfile --build-arg PYTHON_REGISTRY=public.ecr.aws/docker/library -t vmd-agent:ci . && exit 0
            echo "build failed (attempt $i); the registry may be busy; retrying"; sleep 20
          done
          exit 1
      - name: Smoke test
        run: |
          mkdir -p data && cp tests/data/1ubq.pdb data/
          # the image runs as an unprivileged user; run as the owner of the mounted folder so it can write there
          U="--user $(id -u):$(id -g) -e HOME=/tmp"
          docker run --rm $U -v "$PWD/data:/data" vmd-agent:ci tool probe_environment | grep -q matplotlib
          docker run --rm $U -v "$PWD/data:/data" vmd-agent:ci \
            tool visualize_and_interpret /data/1ubq.pdb --out /data/out --views front --renderer matplotlib
          test -s data/out/views/front.png
      - name: Server path sandbox is active in the image
        run: |
          docker run --rm --entrypoint python vmd-agent:ci -c "
          from vmd_agent.security import check_path, SecurityError
          check_path('/data/x.pdb')
          try:
              check_path('/etc/passwd'); raise SystemExit('sandbox did NOT block /etc/passwd')
          except SecurityError:
              print('sandbox ok')"
      - name: Image contains no VMD
        run: |
          ! docker run --rm --entrypoint sh vmd-agent:ci -c 'command -v vmd || test -e /opt/vmd/bin/vmd'

  installer:
    # The one-line installers, run from this commit on a clean machine of each kind into a throwaway folder; then the installed program is used.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install (Mac and Linux)
        if: runner.os != 'Windows'
        run: VMD_AGENT_HOME="$RUNNER_TEMP/vmd" VMD_AGENT_SKIP_SETUP=1 sh install/install.sh
      - name: Use it (Mac and Linux)
        if: runner.os != 'Windows'
        run: |
          R="$RUNNER_TEMP/vmd/bin/vmd-agent"
          mkdir -p "$RUNNER_TEMP/files" && cd "$RUNNER_TEMP/files"
          "$R" setup --yes --use skip --data-dir "$RUNNER_TEMP/files"
          "$R" doctor
          "$R" tool probe_environment | head -20
          "$R" tools | head -5
          "$R" models | head -4
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VMD_AGENT_HOME = "$env:RUNNER_TEMP\vmd"
          $env:VMD_AGENT_SKIP_SETUP = "1"
          powershell -ExecutionPolicy Bypass -File install/install.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Use it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $r = "$env:RUNNER_TEMP\vmd\bin\vmd-agent.cmd"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\files" | Out-Null
          Set-Location "$env:RUNNER_TEMP\files"
          & $r setup --yes --use skip --data-dir "$env:RUNNER_TEMP\files"; if ($LASTEXITCODE -ne 0) { exit 1 }
          & $r doctor; if ($LASTEXITCODE -ne 0) { exit 1 }
          & $r tool probe_environment | Select-Object -First 20; if ($LASTEXITCODE -ne 0) { exit 1 }
          & $r models | Select-Object -First 4
