<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vmd-agent</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="top">
  <span class="logo"></span>
  <h1>vmd-agent <small id="ver"></small></h1>
  <span class="grow"></span>
  <button class="iconbtn" id="theme" title="Switch light and dark">Light / dark</button>
</header>

<div id="work">
  <section class="pane" id="molecules">
    <header>Molecules <span class="grow"></span></header>
    <div id="drop">Drop files here, or click to add<input id="pick" type="file" multiple hidden></div>
    <div class="scroll" id="files"></div>
    <div id="info" hidden></div>
  </section>

  <section class="pane" id="displaypane">
    <header>Display <span class="grow"></span><span id="folder"></span></header>
    <div id="display">
      <canvas id="view"></canvas>
      <div id="media"></div>
      <div id="nodata"><div><b>Nothing drawn yet</b>Double-click a structure on the left. Drag to rotate, scroll to zoom, shift-drag to move, double-click the picture to reset.</div></div>
      <div id="bar">
        <span class="chip">Drawing <select id="rep"><option>Trace</option><option>Lines</option><option>VDW</option><option>Points</option></select></span>
        <span class="chip">Colour <select id="color"><option>Name</option><option>Chain</option><option>ResType</option><option>Resid</option><option>Index</option><option>Mono</option></select></span>
        <span class="chip"><label><input type="checkbox" id="show-protein" checked> protein</label><label><input type="checkbox" id="show-other" checked> other</label><label><input type="checkbox" id="show-water"> water</label></span>
        <span class="chip"><button id="reset" title="Reset the view">Reset</button><button id="snap" title="Save the picture as a PNG">Save PNG</button></span>
      </div>
      <div id="caption"></div>
      <div id="frames"><span class="chip"><button id="play" title="Play">▶</button></span><input type="range" id="slider" min="0" max="0" value="0"><span class="chip" id="flabel">frame 1</span>
        <span class="chip">speed <select id="fps"><option value="4">4/s</option><option value="8" selected>8/s</option><option value="16">16/s</option><option value="30">30/s</option></select></span></div>
    </div>
    <div id="gallery"></div>
  </section>

  <section class="pane" id="assistant">
    <div class="tabs"><button class="tab on" data-p="chat">Chat</button><button class="tab" data-p="jobs">Whole jobs</button></div>
    <div id="chat" class="on">
      <div id="banner"></div>
      <div class="scroll" id="scroll"><div id="log"></div></div>
      <div class="hints" id="hints"></div>
      <div id="composer">
        <textarea id="q" rows="1" placeholder="Ask about a file, for example: what is in protein.pdb?"></textarea>
        <button class="btn" id="new" title="Start a new conversation">New</button>
        <button class="btn primary" id="send">Send</button>
      </div>
    </div>
    <div id="jobs"><div class="scroll" id="wf"></div></div>
  </section>

  <section class="pane" id="console">
    <header>Console <span class="grow"></span><span id="totals"></span><button class="btn small" id="clear">Clear</button></header>
    <div id="consolelog"></div>
  </section>
</div>

<footer id="status">
  <span id="statusleft"></span>
  <span class="grow"></span>
  <span>chat tools <select id="profile"></select></span>
</footer>
<script src="/assets/viewer.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
